<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Clarity</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body class="auth-body">

    <div class="auth-container">

        <a href="/" class="auth-logo">Clarity</a>

        <h1 class="auth-heading">Create your account.</h1>
        <p class="auth-subtext">Start tracking smarter today.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="auth-error">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form class="auth-form" method="POST" action="/register" onsubmit="return validateRegister()">

            <div class="form-group">
                <label for="name" class="form-label">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-input"
                    placeholder="John Doe"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-input"
                    placeholder="john@email.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>

                <div class="input-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="Minimum 8 characters"
                        required
                    >

                    <span class="toggle-password" onclick="togglePassword('password')">
                        <i class="fa-solid fa-eye" id="password-icon"></i>
                    </span>
                </div>

            </div>

            <div class="form-group">
                <label for="confirm-password" class="form-label">Confirm Password</label>

                <div class="input-wrapper">
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        class="form-input"
                        placeholder="Repeat your password"
                        required
                    >

                    <span class="toggle-password" onclick="togglePassword('confirm-password')">
                        <i class="fa-solid fa-eye" id="confirm-password-icon"></i>
                    </span>
                </div>

            </div>

            <div class="form-group">
                <label for="role" class="form-label">Your Role</label>

                <select
                    id="role"
                    name="role"
                    class="form-input form-select-custom"
                    required
                >
                    <option value="" selected disabled>Select your role</option>
                    <option value="Student">Student</option>
                    <option value="Head of Family">Head of Family</option>
                    <option value="Daily Wager">Daily Wager</option>
                    <option value="Salaried Employee">Salaried Employee</option>
                    <option value="Business Owner">Business Owner</option>
                </select>

            </div>

            <button type="submit" class="auth-btn">
                Create Account
            </button>

        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
